<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: blob:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'">
<title>Eye Refs</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="has-sidebar">

<canvas id="rulerTop" class="ruler" aria-hidden="true"></canvas>
<canvas id="rulerLeft" class="ruler" aria-hidden="true"></canvas>
<div id="rulerCorner" class="ruler" aria-hidden="true"></div>
<div id="canvas" class="bg-dots" tabindex="-1">
  <div id="world"></div>
  <div id="overlay"></div>
  <div id="marquee" hidden></div>
</div>

<div id="start" hidden>
  <div class="start-drop"><span class="start-icon" data-i="image"></span><p>Drop or paste images here</p><button class="btn" id="startNew">New board</button></div>
  <div class="start-recent panel" id="startRecent" hidden>
    <div class="start-head"><h3>Recent</h3><span class="start-actions"><button class="btn ghost" id="startBrowse">All boards</button><button class="btn ghost" id="startOpen">Open file</button></span></div>
    <div class="start-cards" id="startCards"></div>
  </div>
</div>

<aside id="sidebar" class="panel" aria-label="Projects">
  <div class="side-head">
    <span class="logo" data-i="logo"></span>
    <span class="app-name">Eye Refs</span>
    <button class="icon-btn small" id="hideSidebar" aria-label="Hide sidebar" data-i="sidebar" style="margin-left:auto"></button>
  </div>
  <label class="search" for="search">
    <span data-i="search"></span>
    <input id="search" type="text" placeholder="Search" aria-label="Search projects" spellcheck="false">
    <span class="kbd" id="searchKbd"></span>
  </label>
  <div class="seg" role="tablist" aria-label="Show">
    <button data-filter="all" class="on" role="tab">All</button>
    <button data-filter="mine" role="tab">Mine</button>
    <button data-filter="shared" role="tab">Shared</button>
  </div>
  <div id="tree" role="tree"></div>
  <div class="side-foot">
    <div style="display:flex;gap:4px">
      <button class="foot-btn" id="newProject"><span data-i="plus"></span>New board</button>
      <button class="foot-btn" id="joinBoard"><span data-i="people"></span>Join a board</button>
    </div>
    <button class="account" id="account" aria-label="Account and settings">
      <span class="avatar" id="meAvatar"></span>
      <span style="display:flex;flex-direction:column;min-width:0;line-height:1.2">
        <span class="who-name" id="meName"></span>
        <span class="who-sub" id="meSub">Saved in Documents / Eye Refs</span>
      </span>
    </button>
  </div>
</aside>

<div id="topbar" aria-hidden="true"></div>

<div id="title" class="pill" hidden>
  <button class="logo logo-btn" id="showSidebar" aria-label="Show sidebar" data-i="logo" hidden></button>
  <span class="t-name" id="tName"></span>
  <span class="t-lock" id="tLock" hidden data-i="lock" title="Canvas locked"></span>
  <span class="t-status" id="tStatus"></span>
  <button class="t-sections" id="tSections" hidden aria-label="Sections" title="Jump to a section"><span id="tSectionsN"></span></button>
</div>

<div id="topRight">
  <div id="presence" class="pill" hidden>
    <span class="stack" id="pStack"></span>
    <span class="p-text" id="pText"></span>
  </div>
  <button class="btn update-btn" id="update" hidden>Restart to update</button>
  <div class="pill setpill"><button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings" data-i="settings"></button></div>
  <button class="btn" id="share" hidden>Share</button>
  <div class="pill winctl" id="winctl">
    <button class="icon-btn" id="wMin" aria-label="Minimize" data-i="min"></button>
    <button class="icon-btn" id="wMax" aria-label="Maximize" data-i="max"></button>
    <button class="icon-btn" id="wClose" aria-label="Close" data-i="close"></button>
  </div>
</div>

<div id="toolbar" class="pill" role="toolbar" aria-label="Tools">
  <button class="icon-btn on" data-tool="select" aria-label="Select" title="Select" data-i="select"></button>
  <button class="icon-btn" data-tool="hand" aria-label="Pan" title="Pan (Alt + drag, or middle mouse)" data-i="hand"></button>
  <span class="sep"></span>
  <button class="icon-btn" id="tAddImage" aria-label="Add images" title="Add images" data-i="image"></button>
  <button class="icon-btn" id="tAddVideo" aria-label="Add videos" title="Add videos" data-i="video"></button>
  <button class="icon-btn" id="tNote" aria-label="Add note" title="Note" data-i="note"></button>
  <button class="icon-btn" data-tool="pen" aria-label="Draw" title="Draw" data-i="pen"></button>
  <button class="icon-btn" data-tool="text" aria-label="Text" title="Text (T)" data-i="text"></button>
  <button class="icon-btn" data-tool="comment" aria-label="Comment" title="Comment on a picture" data-i="comment"></button>
  <span class="sep"></span>
  <button class="icon-btn" id="tTop" aria-label="Always on top" title="Always on top" data-i="pin"></button>
  <button class="icon-btn" id="tThrough" aria-label="Click through" title="Click through" data-i="through"></button>
</div>

<div id="penBar" class="pill" hidden role="toolbar" aria-label="Pen">
  <span class="sizes" id="penSizes"></span>
  <span class="sep"></span>
  <span class="styles" id="penStyles"></span>
  <span class="sep"></span>
  <button class="tool" id="penText" aria-label="Text" title="Text (T)" data-i="text"></button>
  <button class="tool" id="penEraser" aria-label="Eraser" title="Eraser (E)" data-i="eraser"></button>
  <span class="sep"></span>
  <button class="cwheel" id="penColor" aria-label="Pen colour" title="Pen colour"><span class="rg"></span><span class="d" id="penColorDot"></span></button>
  <div class="picker" id="picker" hidden>
    <div class="disc" id="pkDisc"><div class="dark" id="pkDark"></div><div class="k" id="pkDiscK"></div></div>
    <div class="sl" id="pkBright" aria-label="Brightness"><div class="k" id="pkBrightK"></div></div>
    <div class="row"><div class="sl chk" id="pkAlpha" aria-label="Opacity"><div class="fill" id="pkAlphaFill"></div><div class="k" id="pkAlphaK"></div></div><button class="ib" id="pkDrop" aria-label="Pick a colour from the screen" title="Pick from the screen" data-i="dropper"></button></div>
    <div class="row"><input class="fld" id="pkHex" maxlength="7" spellcheck="false" aria-label="Hex colour"><button class="ib" id="pkCopy" aria-label="Copy colour" title="Copy" data-i="copy"></button><input class="fld pct" id="pkPct" aria-label="Opacity percent"></div>
    <div class="rec" id="pkRecent"></div>
  </div>
</div>

<div id="zoom" class="pill">
  <button class="icon-btn" id="zOut" aria-label="Zoom out" data-i="minus"></button>
  <button class="z-val" id="zVal" aria-label="Fit everything">100%</button>
  <button class="icon-btn" id="zIn" aria-label="Zoom in" data-i="plus"></button>
</div>

<div id="videoBar" class="pill" hidden>
  <button class="icon-btn" id="vPlay" aria-label="Play" data-i="play"></button>
  <span class="time" id="vTime">0:00 / 0:00</span>
  <div class="track" id="vTrack" aria-label="Scrub">
    <div class="rail"></div>
    <div class="range" id="vRange"></div>
    <div class="mark" id="vIn" title="Start"></div>
    <div class="mark" id="vOut" title="End"></div>
    <div class="head" id="vHead"></div>
  </div>
  <button class="icon-btn" id="vLoop" aria-label="Loop" title="Loop" data-i="loop"></button>
  <button class="speed" id="vSpeed" title="Speed">1x</button>
  <button class="icon-btn" id="vMute" aria-label="Sound" title="Sound" data-i="muted"></button>
  <button class="icon-btn" id="vGrab" aria-label="Grab frame" title="Grab frame (F)" data-i="camera"></button>
</div>

<div id="jobs" class="pill" hidden><span class="ring"></span><span id="jobText"></span></div>
<div id="menu" class="menu" hidden role="menu"></div>
<div id="settings" class="settings" hidden role="dialog" aria-label="Settings"></div>
<div id="modalWrap" hidden></div>
<div id="opening" hidden aria-live="polite"><div class="opening-bar"></div><div class="opening-card"><span class="opening-spin"></span><span class="opening-label">Opening</span><span id="openingName"></span></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="screen" hidden></div>

<script src="icons.js"></script>
<script src="ui.js"></script>
<script src="board.js"></script>
<script src="app.js"></script>
</body>
</html>
