name: Build installers

# Every push to main builds both installers.
# They are published only when package.json has a version that has no release yet
# Versions with a dash (1.1.0-beta.1) go out as pre-releases, plain versions (1.0.1) as full releases.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      type: ${{ steps.v.outputs.type }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version is new
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publish=never" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released. Building only, not publishing."
          else
            echo "publish=always" >> "$GITHUB_OUTPUT"
            echo "Publishing v$VERSION"
          fi
          case "$VERSION" in
            *-*) echo "type=prerelease" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=release" >> "$GITHUB_OUTPUT" ;;
          esac

  mac:
    needs: prepare
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Release or pre-release
        shell: bash
        run: node -e "const f='package.json',p=require('./'+f);p.build.publish[0].releaseType='${{ needs.prepare.outputs.type }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - name: Apple Silicon build
        run: npx electron-builder --mac dmg pkg --arm64 --publish ${{ needs.prepare.outputs.publish }}
      - name: Intel build (with the Intel copy of ffmpeg)
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          npx electron-builder --mac dmg pkg --x64 --publish ${{ needs.prepare.outputs.publish }}
      - uses: actions/upload-artifact@v4
        with:
          name: eye-refs-mac
          path: |
            dist/*.dmg
            dist/*.pkg

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Release or pre-release
        shell: bash
        run: node -e "const f='package.json',p=require('./'+f);p.build.publish[0].releaseType='${{ needs.prepare.outputs.type }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - run: npx electron-builder --win nsis --x64 --publish ${{ needs.prepare.outputs.publish }}
      - uses: actions/upload-artifact@v4
        with: { name: eye-refs-windows, path: 'dist/*.exe' }
