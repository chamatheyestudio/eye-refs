name: Build installers

# Every push to main builds both installers.
# They are published only when package.json has a version that has no release yet
# Versions with a dash (1.1.0-beta.1) go out as pre-releases, plain versions (1.0.1) as full releases.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      type: ${{ steps.v.outputs.type }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version is new
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publish=never" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released. Building only, not publishing."
          else
            echo "publish=always" >> "$GITHUB_OUTPUT"
            echo "Publishing v$VERSION"
          fi
          case "$VERSION" in
            *-*) echo "type=prerelease" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=release" >> "$GITHUB_OUTPUT" ;;
          esac

  mac:
    needs: prepare
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Release or pre-release
        shell: bash
        run: node -e "const f='package.json',p=require('./'+f);p.build.publish[0].releaseType='${{ needs.prepare.outputs.type }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - name: Load the Eye Refs signing certificate
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          PW: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No certificate, signing ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/eyerefs.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "EYEREFS_SIGN_IDENTITY=Eye Refs by Matte Black" >> "$GITHUB_ENV"
          echo "EYEREFS_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Apple Silicon build
        run: npx electron-builder --mac dmg pkg --arm64 --publish ${{ needs.prepare.outputs.publish }}
      - name: Intel build (with the Intel copy of ffmpeg)
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          npx electron-builder --mac dmg pkg --x64 --publish ${{ needs.prepare.outputs.publish }}
      - uses: actions/upload-artifact@v4
        with:
          name: eye-refs-mac
          path: |
            dist/*.dmg
            dist/*.pkg

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Release or pre-release
        shell: bash
        run: node -e "const f='package.json',p=require('./'+f);p.build.publish[0].releaseType='${{ needs.prepare.outputs.type }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - run: npx electron-builder --win nsis --x64 --publish ${{ needs.prepare.outputs.publish }}
      - uses: actions/upload-artifact@v4
        with: { name: eye-refs-windows, path: 'dist/*.exe' }
